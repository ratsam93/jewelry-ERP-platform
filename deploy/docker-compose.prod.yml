# CaratFlow production stack. Lives in /opt/caratflow on the server next to:
#   .env            (copy of deploy/.env.production.example with real values)
#   Caddyfile       (copied here by the deploy workflow)
#
#   docker compose -f docker-compose.prod.yml --env-file .env up -d
#
# Only Caddy publishes ports (80, 443). Everything else lives on the private
# "caratflow" network.

name: caratflow

x-restart: &restart
  restart: unless-stopped

x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "5"

services:
  caddy:
    <<: [*restart, *logging]
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      caratflow:
        # Containers reach the public file host through Caddy (valid TLS cert).
        aliases:
          - files.${DOMAIN}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
      storefront:
        condition: service_healthy
      website:
        condition: service_healthy

  mysql:
    <<: [*restart, *logging]
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caratflow}
      MYSQL_USER: ${MYSQL_USER:-caratflow}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --max-connections=200
    volumes:
      - mysql_data:/var/lib/mysql
    networks: [caratflow]
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  redis:
    <<: [*restart, *logging]
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    command: sh -c 'exec redis-server --requirepass "$$REDIS_PASSWORD" --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction'
    volumes:
      - redis_data:/data
    networks: [caratflow]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 6

  minio:
    <<: [*restart, *logging]
    # Built from source (docker/minio.Dockerfile): MinIO removed its Docker Hub images.
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/caratflow-minio:${IMAGE_TAG:-latest}
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks: [caratflow]
    healthcheck:
      # The image has no curl/mc; busybox wget hits MinIO's readiness endpoint.
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # One-shot: creates the uploads bucket (idempotent), then exits.
  minio-init:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/caratflow-mc:${IMAGE_TAG:-latest}
    restart: "no"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-caratflow}
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$S3_BUCKET"
        echo "bucket $$S3_BUCKET ready"
    networks: [caratflow]
    depends_on:
      minio:
        condition: service_healthy

  # One-shot: applies the Prisma schema, then exits. The repo has no prisma
  # migrations folder, so this uses `prisma db push` (no destructive changes are
  # applied without an explicit opt-in; see docs/DEPLOYMENT-DOCKER.md).
  migrate:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/caratflow-api:${IMAGE_TAG:-latest}
    restart: "no"
    working_dir: /app
    command:
      - /opt/tools/node_modules/.bin/prisma
      - db
      - push
      - --schema
      - /app/node_modules/@caratflow/db/prisma/schema
      - --skip-generate
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-caratflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-caratflow}
    networks: [caratflow]
    depends_on:
      mysql:
        condition: service_healthy

  api:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER}/caratflow-api:${IMAGE_TAG:-latest}
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      TRUST_PROXY: "1"
      DATABASE_URL: mysql://${MYSQL_USER:-caratflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-caratflow}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (>= 32 chars)}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-15m}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-7d}
      CORS_ORIGINS: ${CORS_ORIGINS:-https://app.${DOMAIN},https://shop.${DOMAIN},https://${DOMAIN},https://www.${DOMAIN}}
      WEB_URL: https://app.${DOMAIN}/admin
      STOREFRONT_URL: https://shop.${DOMAIN}
      STORAGE_PROVIDER: MINIO
      S3_ENDPOINT: ${S3_ENDPOINT:-https://files.${DOMAIN}}
      S3_BUCKET: ${S3_BUCKET:-caratflow}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_FORCE_PATH_STYLE: "true"
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      BNPL_WEBHOOK_SECRET: ${BNPL_WEBHOOK_SECRET:-}
      HARDWARE_WEBHOOK_SECRET: ${HARDWARE_WEBHOOK_SECRET:-}
      # Optional integrations / overrides. A key with no value passes it through from
      # .env and leaves it UNSET in the container when it is not defined there.
      RAZORPAY_KEY_ID:
      RAZORPAY_KEY_SECRET:
      RAZORPAY_WEBHOOK_SECRET:
      STRIPE_SECRET_KEY:
      STRIPE_WEBHOOK_SECRET:
      CASHFREE_CLIENT_ID:
      CASHFREE_CLIENT_SECRET:
      CASHFREE_ENV:
      CASHFREE_VERIFY_CLIENT_ID:
      CASHFREE_VERIFY_CLIENT_SECRET:
      PAYMENT_GATEWAY_PROVIDER:
      OTP_CHANNEL:
      WHATSAPP_APP_SECRET:
      WHATSAPP_VERIFY_TOKEN:
      FCM_SERVER_KEY:
      SHIPROCKET_EMAIL:
      SHIPROCKET_PASSWORD:
      SHOPIFY_WEBHOOK_SECRET:
      MASTERS_INDIA_CLIENT_ID:
      MASTERS_INDIA_CLIENT_SECRET:
      MASTERS_INDIA_USERNAME:
      MASTERS_INDIA_PASSWORD:
      MASTERS_INDIA_GSTIN:
      RATE_PROVIDER:
      RATE_API_URL:
      RATE_API_KEY:
      METALS_DEV_API_KEY:
      MCX_API_URL:
      MCX_API_KEY:
      GIA_API_URL:
      GIA_API_KEY:
      IGI_API_URL:
      IGI_API_KEY:
      GOOGLE_CLIENT_ID:
      APPLE_CLIENT_ID:
      APPLE_TEAM_ID:
      FB_APP_ID:
      FB_APP_SECRET:
      HUID_ENFORCEMENT:
      SWAGGER_ENABLED:
      SWAGGER_USER:
      SWAGGER_PASSWORD:
      THROTTLE_LIMIT:
      THROTTLE_TTL_MS:
    networks: [caratflow]
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  web:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER}/caratflow-web:${IMAGE_TAG:-latest}
    networks: [caratflow]
    depends_on:
      api:
        condition: service_healthy

  storefront:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER}/caratflow-storefront:${IMAGE_TAG:-latest}
    networks: [caratflow]
    depends_on:
      api:
        condition: service_healthy

  website:
    <<: [*restart, *logging]
    image: ghcr.io/${GHCR_OWNER}/caratflow-website:${IMAGE_TAG:-latest}
    networks: [caratflow]

  # ---- On-demand one-shot tools (not started by `up`; run with --profile tools) ----
  # First-time demo data:  docker compose --profile tools run --rm seed-demo
  seed-demo:
    profiles: [tools]
    image: ghcr.io/${GHCR_OWNER}/caratflow-api:${IMAGE_TAG:-latest}
    restart: "no"
    working_dir: /app/node_modules/@caratflow/db
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T=/opt/tools/node_modules/.bin/tsx
        $$T src/seed.ts
        $$T src/seed-permissions.ts
        $$T src/demo-seed.ts
        $$T src/seed-demo-ledger.ts
        $$T src/seed-demo-customer.ts
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-caratflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-caratflow}
    networks: [caratflow]
    depends_on:
      mysql:
        condition: service_healthy

  # Create your real tenant + first admin (see docs/DEPLOYMENT-DOCKER.md).
  bootstrap-tenant:
    profiles: [tools]
    image: ghcr.io/${GHCR_OWNER}/caratflow-api:${IMAGE_TAG:-latest}
    restart: "no"
    working_dir: /app/node_modules/@caratflow/db
    command: ["/opt/tools/node_modules/.bin/tsx", "src/bootstrap-tenant.ts"]
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-caratflow}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-caratflow}
      TENANT_ID:
      TENANT_NAME:
      TENANT_COUNTRY:
      TENANT_CURRENCY:
      TENANT_TIMEZONE:
      RESET_PASSWORD:
      DRY_RUN:
      TENANT_SLUG:
      ADMIN_EMAIL:
      ADMIN_PASSWORD:
      ADMIN_FIRST_NAME:
      ADMIN_LAST_NAME:
    networks: [caratflow]
    depends_on:
      mysql:
        condition: service_healthy

networks:
  caratflow: {}

volumes:
  mysql_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
